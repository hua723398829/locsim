
name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tools and Dependencies
        run: |
          set -e

          brew install xcodegen

          echo "===== Xcode Environment ====="
          xcodebuild -version
          swift --version

          echo "===== Fetch Vendor ====="
          if [ -f "tools/fetch-vendor.sh" ]; then
            bash tools/fetch-vendor.sh
          else
            echo "ERROR: tools/fetch-vendor.sh not found"
            exit 1
          fi

          echo "===== Prepare IDevice ====="
          mkdir -p Frameworks

          if [ ! -d "Frameworks/IDevice.xcframework" ]; then
            FOUND_ZIP=$(find . -name "idevice-xcframework*.zip" -print -quit)

            if [ -n "$FOUND_ZIP" ]; then
              mkdir -p temp_extract
              unzip -q "$FOUND_ZIP" -d temp_extract

              XC_FRAMEWORK=$(find temp_extract -name "IDevice.xcframework" -type d -print -quit)

              if [ -z "$XC_FRAMEWORK" ]; then
                XC_FRAMEWORK=$(find temp_extract -name "*.xcframework" -type d -print -quit)
              fi

              if [ -z "$XC_FRAMEWORK" ]; then
                echo "ERROR: No xcframework found in archive"
                exit 1
              fi

              cp -R "$XC_FRAMEWORK" Frameworks/IDevice.xcframework
            fi
          fi

          if [ ! -d "Frameworks/IDevice.xcframework" ]; then
            FOUND_DIR=$(find . -name "IDevice.xcframework" -type d ! -path "./Frameworks/*" -print -quit)

            if [ -n "$FOUND_DIR" ]; then
              cp -R "$FOUND_DIR" Frameworks/IDevice.xcframework
            fi
          fi

          test -d Frameworks/IDevice.xcframework
          test -f Frameworks/IDevice.xcframework/Info.plist

          echo "IDevice framework ready"

      - name: Patch Source Code
        run: |
          set -e

          echo "===== Restore original LocationControls.swift ====="

          git show HEAD:LocSimWidgets/LocationControls.swift \
            > LocSimWidgets/LocationControls.swift

          echo "===== Patch IntentModes ====="

          python3 <<'PY'
          from pathlib import Path
          import re

          matches = list(Path(".").rglob("ControlIntents.swift"))

          if not matches:
              raise SystemExit("ERROR: ControlIntents.swift not found")

          for path in matches:
              text = path.read_text()

              pattern = (
                  r'(?m)^[ \t]*@available\(iOS 26\.0,\s*\*\)'
                  r'[ \t]*\n'
                  r'[ \t]*static var supportedModes: IntentModes'
                  r'[^\n]*\n?'
              )

              new_text, count = re.subn(pattern, "", text)

              if count:
                  path.write_text(new_text)
                  print(f"Patched: {path}")
              else:
                  print(f"WARNING: IntentModes declaration not matched in {path}")

              if "IntentModes" in path.read_text():
                  raise SystemExit(
                      f"ERROR: IntentModes still exists in {path}"
                  )

          PY

          echo "===== Verify Control Widgets ====="

          grep -n "SetLastLocationControl" \
            LocSimWidgets/LocationControls.swift

          grep -n "ClearLocationControl" \
            LocSimWidgets/LocationControls.swift

          echo "===== Verify changes ====="

          git diff --check
          git diff --stat

      - name: Generate Xcode Project
        run: |
          set -e

          xcodegen generate

          PROJECT_FILE=$(find . -maxdepth 1 -name "*.xcodeproj" -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Xcode project not generated"
            exit 1
          fi

          echo "Project: $PROJECT_FILE"

          xcodebuild -list -project "$PROJECT_FILE"

      - name: Build unsigned app
        run: |
          set -e

          PROJECT_FILE=$(find . -maxdepth 1 -name "*.xcodeproj" -print -quit)

          xcodebuild \
            -project "$PROJECT_FILE" \
            -scheme LocSim \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -e

          APP="build/Build/Products/Release-iphoneos/LocSim.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: LocSim.app not found"

            find build -name "*.app" -type d

            exit 1
          fi

          echo "Found app: $APP"

          test -f "$APP/Info.plist"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP" Payload/

          zip -qr LocSim-unsigned.ipa Payload

          echo "===== IPA Result ====="
          ls -lh LocSim-unsigned.ipa
          unzip -l LocSim-unsigned.ipa | head -n 30

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LocSim-unsigned-ipa
          path: LocSim-unsigned.ipa
          if-no-files-found: error

name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tools and Dependencies
        run: |
          # 安装 XcodeGen
          brew install xcodegen
          
          # 运行作者的依赖拉取脚本
          if [ -f "tools/fetch-vendor.sh" ]; then
            echo "Running fetch-vendor.sh..."
            bash tools/fetch-vendor.sh || echo "脚本执行失败，但尝试继续"
          fi
          
          # 手动确保 Frameworks/IDevice.xcframework 存在
          mkdir -p Frameworks
          if [ ! -d "Frameworks/IDevice.xcframework" ]; then
            echo "Frameworks/IDevice.xcframework not found. Trying to fix..."
            FOUND_ZIP=$(find . -name "idevice-xcframework*.zip" | head -n 1)
            if [ -n "$FOUND_ZIP" ]; then
              echo "Found zip: $FOUND_ZIP, extracting..."
              unzip -q "$FOUND_ZIP" -d temp_extract
              XC_FRAMEWORK=$(find temp_extract -name "*.xcframework" | head -n 1)
              if [ -n "$XC_FRAMEWORK" ]; then
                mv "$XC_FRAMEWORK" "Frameworks/IDevice.xcframework"
                echo "✅ Successfully placed IDevice.xcframework"
              fi
            else
              FOUND_DIR=$(find . -name "*.xcframework" -type d | head -n 1)
              if [ -n "$FOUND_DIR" ]; then
                echo "Found existing dir: $FOUND_DIR, moving..."
                mv "$FOUND_DIR" "Frameworks/IDevice.xcframework"
                echo "✅ Successfully placed IDevice.xcframework"
              else
                echo "❌ Error: Cannot find any xcframework zip or folder!"
                ls -la
              fi
            fi
          else
             echo "✅ IDevice.xcframework already exists in Frameworks/"
          fi

      - name: Patch Source Code
        run: |
          # 修复 iOS 18 API 在 iOS 17.4 目标下编译报错的问题
          # 1. 把 ControlIntents.swift 中不支持 iOS 17 的那行代码注释掉
          sed -i '' 's/static var supportedModes: IntentModes { .foreground }/\/\/ static var supportedModes: IntentModes { .foreground }/' LiveActivity/ControlIntents.swift || true
          
          # 2. 为了防止其他地方还报错，直接把 project.yml 里的最低版本号全局升级为 18.0
          sed -i '' 's/17.4/18.0/g' project.yml || true

      - name: Generate Xcode Project
        run: |
          # 根据 project.yml 生成工程文件
          xcodegen generate
          echo "生成的工程文件列表："
          ls -d *.xcodeproj

      - name: Build unsigned app
        run: |
          set -e
          
          PROJECT_FILE=$(find . -maxdepth 1 -name "*.xcodeproj" | head -n1)
          PROJECT_ARGS="-project $PROJECT_FILE"
          
          echo "使用的工程参数: $PROJECT_ARGS"

          SCHEME=$(xcodebuild -list $PROJECT_ARGS 2>/dev/null | awk '/Schemes:/{flag=1;next} flag && NF{print $1; exit}')
          echo "使用的 scheme: $SCHEME"

          xcodebuild \
            $PROJECT_ARGS \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -e
          APP=$(find . -name "*.app" -path "*/Release-iphoneos/*" | head -n 1)
          if [ -z "$APP" ]; then
            echo "❌ 编译成功，但未找到 .app 文件"
            exit 1
          fi
          echo "找到 App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr LocSim-unsigned.ipa Payload
          ls -lh LocSim-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LocSim-unsigned-ipa
          path: LocSim-unsigned.ipa
          if-no-files-found: error

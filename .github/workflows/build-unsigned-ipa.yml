name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tools and Dependencies
        run: |
          # 安装 XcodeGen 来生成 xcodeproj
          brew install xcodegen
          
          # 运行作者的依赖拉取脚本（如果有的话）
          if [ -f "tools/fetch-vendor.sh" ]; then
            echo "Running fetch-vendor.sh..."
            bash tools/fetch-vendor.sh || echo "脚本执行失败，但尝试继续"
          fi

      - name: Generate Xcode Project
        run: |
          # 根据 project.yml 生成工程文件
          xcodegen generate
          echo "生成的工程文件列表："
          ls -d *.xcodeproj

      - name: Build unsigned app
        run: |
          set -e
          
          # 此时根目录已经有了 .xcodeproj
          PROJECT_FILE=$(find . -maxdepth 1 -name "*.xcodeproj" | head -n1)
          PROJECT_ARGS="-project $PROJECT_FILE"
          
          echo "使用的工程参数: $PROJECT_ARGS"

          # 自动读取 scheme
          SCHEME=$(xcodebuild -list $PROJECT_ARGS 2>/dev/null | awk '/Schemes:/{flag=1;next} flag && NF{print $1; exit}')
          echo "使用的 scheme: $SCHEME"

          xcodebuild \
            $PROJECT_ARGS \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -e
          APP=$(find . -name "*.app" -path "*/Release-iphoneos/*" | head -n1)
          if [ -z "$APP" ]; then
            echo "❌ 编译成功，但未找到 .app 文件"
            exit 1
          fi
          echo "找到 App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr LocSim-unsigned.ipa Payload
          ls -lh LocSim-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LocSim-unsigned-ipa
          path: LocSim-unsigned.ipa
          if-no-files-found: error
